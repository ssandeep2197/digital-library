<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%230d6efd' d='M1 2.8C2.3 2.3 4.5 1.9 7.5 2.6V14c-3-.7-5.2-.3-6.5.2zm14 0C13.7 2.3 11.5 1.9 8.5 2.6V14c3-.7 5.2-.3 6.5.2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#/catalog"><i class="bi bi-book-half me-2"></i><span id="library-name">Digital Library</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#/catalog" data-nav="catalog"><i class="bi bi-search me-1"></i>Catalog</a></li>
          <li class="nav-item"><a class="nav-link" href="#/desk" data-nav="desk"><i class="bi bi-arrow-left-right me-1"></i>Circulation</a></li>
          <li class="nav-item"><a class="nav-link" href="#/members" data-nav="members"><i class="bi bi-people me-1"></i>Members</a></li>
          <li class="nav-item"><a class="nav-link" href="#/notifications" data-nav="notifications"><i class="bi bi-bell me-1"></i>Notifications</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 d-none" id="user-menu">
          <span class="navbar-text small"><i class="bi bi-person-circle me-1"></i><span id="user-name"></span></span>
          <button class="btn btn-sm btn-outline-light" id="logout-button" type="button"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-xl py-4" id="view" aria-live="polite"></main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <!-- Generic form modal, filled in by app.js -->
  <div class="modal fade" id="form-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-modal-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="form-modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="form-modal-body"></div>
        <div class="modal-footer">
          <div class="text-danger small me-auto" id="form-modal-error"></div>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="form-modal-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
