<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Digital Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%230d6efd' d='M1 2.8C2.3 2.3 4.5 1.9 7.5 2.6V14c-3-.7-5.2-.3-6.5.2zm14 0C13.7 2.3 11.5 1.9 8.5 2.6V14c3-.7 5.2-.3 6.5.2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="container">
    <div class="row justify-content-center" style="margin-top: 12vh;">
      <div class="col-sm-9 col-md-6 col-lg-4">
        <div class="text-center mb-4">
          <i class="bi bi-book-half text-primary" style="font-size: 2.5rem;"></i>
          <h1 class="h4 mt-2 mb-0" id="library-name">Digital Library</h1>
          <small class="text-body-secondary">Sign in to continue</small>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <div id="login-error" class="alert alert-danger py-2 small d-none" role="alert"></div>
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggle-password" title="Show password" aria-label="Show password">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="login-btn">
                <span class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
                Sign in
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
