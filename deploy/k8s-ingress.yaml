# Routes library.helloworlds.co.in through the k3s ingress-nginx to the
# Docker container published on the host's docker0 bridge (172.17.0.1:3110).
apiVersion: v1
kind: Service
metadata:
  name: digital-library
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3110
---
apiVersion: v1
kind: Endpoints
metadata:
  name: digital-library
  namespace: default
subsets:
  - addresses:
      - ip: 172.17.0.1
    ports:
      - name: http
        port: 3110
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-library
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - library.helloworlds.co.in
      secretName: digital-library-tls
  rules:
    - host: library.helloworlds.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-library
                port:
                  number: 80
