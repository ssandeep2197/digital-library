services:
  mysql:
    image: mysql:8.4
    container_name: digital-library-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-digital_library}
      MYSQL_USER: ${DB_USER:-library}
      MYSQL_PASSWORD: ${DB_PASSWORD:-library}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: digital-library:latest
    container_name: digital-library
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      TRUST_PROXY: loopback, uniquelocal
    # On the VPS, BIND_ADDR=172.17.0.1 publishes only on the docker0 bridge: reachable
    # from the host and the k3s ingress, not from the internet.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  mysql-data:
